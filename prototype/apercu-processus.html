<title>ERP Full Pack Services</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Jost:wght@300;400;500;600&display=swap">
<style>
  /* Une commande au centre, qui avance de l'étape 1 à l'étape 10 du document
     « Notre processus de fabrication ». Couleurs reprises du document :
     orange Full Pack, anthracite des en-têtes, fond chaud des encadrés. */
  :root {
    --fond: #f6f4f1;
    --carte: #ffffff;
    --encadre: #fbf4ee;
    --bandeau: #2f2e2c;
    --bandeau-actif: #44423f;
    --bandeau-texte: #f3f0ec;
    --bandeau-doux: #aaa49c;

    --texte: #262422;
    --doux: #6f6962;
    --bord: #e3ded7;
    --bord-fort: #cbc4ba;

    --orange: #e8772e;
    --bouton: #b4540f;
    --sur-bouton: #ffffff;
    --orange-pale: #fcece0;
    --orange-texte: #9a4610;

    --ok: #2e7d4f;
    --ok-pale: #e6f4ec;
    --ok-bord: #bfe0cc;
    --alerte: #b3261e;
    --alerte-pale: #fbe9e7;
    --alerte-bord: #f0c4bf;
    --neutre-pale: #efedea;

    --titre: "Jost", ui-sans-serif, system-ui, sans-serif;
    --corps: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --fond: #171513;
      --carte: #211e1b;
      --encadre: #2a221b;
      --bandeau: #0f0e0d;
      --bandeau-actif: #2b2825;
      --bandeau-texte: #f3f0ec;
      --bandeau-doux: #9d968e;
      --texte: #eeeae4;
      --doux: #aba39a;
      --bord: #36312b;
      --bord-fort: #4b443c;
      --orange: #f08a45;
      --bouton: #f08a45;
      --sur-bouton: #1a1512;
      --orange-pale: #3a2616;
      --orange-texte: #f6ad78;
      --ok: #7cc79a;
      --ok-pale: #17291e;
      --ok-bord: #2b4a37;
      --alerte: #f08c80;
      --alerte-pale: #3a1c19;
      --alerte-bord: #5e2a24;
      --neutre-pale: #2a2724;
      color-scheme: dark;
    }
  }

  :root[data-theme="dark"] {
    --fond: #171513;
    --carte: #211e1b;
    --encadre: #2a221b;
    --bandeau: #0f0e0d;
    --bandeau-actif: #2b2825;
    --bandeau-texte: #f3f0ec;
    --bandeau-doux: #9d968e;
    --texte: #eeeae4;
    --doux: #aba39a;
    --bord: #36312b;
    --bord-fort: #4b443c;
    --orange: #f08a45;
    --bouton: #f08a45;
    --sur-bouton: #1a1512;
    --orange-pale: #3a2616;
    --orange-texte: #f6ad78;
    --ok: #7cc79a;
    --ok-pale: #17291e;
    --ok-bord: #2b4a37;
    --alerte: #f08c80;
    --alerte-pale: #3a1c19;
    --alerte-bord: #5e2a24;
    --neutre-pale: #2a2724;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--fond);
    color: var(--texte);
    font-family: var(--corps);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  /* ------------------------------------------------------------ Bandeau */

  .bandeau {
    background: var(--bandeau);
    color: var(--bandeau-texte);
    padding-block: 12px 0;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }

  .bandeau-ligne {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    max-width: 1240px;
    margin: 0 auto;
  }

  .logo { display: flex; align-items: center; gap: 10px; text-decoration: none; color: inherit; }
  .logo .mot { font-family: var(--titre); font-weight: 300; font-size: 21px; letter-spacing: 0.06em; line-height: 1; }
  .logo .mot b { font-weight: 400; color: var(--orange); }
  .logo .sous { font-family: var(--titre); font-size: 11px; letter-spacing: 0.32em; color: var(--orange); text-transform: lowercase; }
  .logo .barre { width: 4px; height: 30px; background: var(--orange); border-radius: 2px; }

  .onglets { display: flex; gap: 2px; flex-wrap: wrap; max-width: 1240px; margin: 10px auto 0; }

  .onglets a {
    color: var(--bandeau-texte);
    text-decoration: none;
    font-size: 14.5px;
    font-weight: 500;
    padding: 9px 16px;
    border-radius: 6px 6px 0 0;
    border-bottom: 3px solid transparent;
    opacity: 0.85;
  }

  .onglets a:hover { background: var(--bandeau-actif); opacity: 1; }
  .onglets a[aria-current="page"] { background: var(--fond); color: var(--texte); border-bottom-color: var(--orange); opacity: 1; }

  /* ------------------------------------------------------------ Contenu */

  main {
    padding-block: 22px 72px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }

  .page { max-width: 1240px; margin: 0 auto; min-width: 0; }

  h1 { font-family: var(--titre); font-weight: 500; font-size: 27px; letter-spacing: -0.005em; margin: 0; text-wrap: balance; }
  h2 { font-family: var(--titre); font-weight: 500; font-size: 19px; margin: 0; text-wrap: balance; }
  h3 { font-family: var(--titre); font-weight: 500; font-size: 16px; margin: 0; }
  h4 { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em; color: var(--doux); margin: 0; }

  .titre-page { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-bottom: 18px; }
  .sous-titre { color: var(--doux); margin: 4px 0 0; }
  .retour { display: inline-block; color: var(--doux); text-decoration: none; font-size: 13.5px; margin-bottom: 8px; }
  .retour:hover { color: var(--texte); }

  .carte { background: var(--carte); border: 1px solid var(--bord); border-radius: 10px; min-width: 0; }
  .carte + .carte, .bloc + .bloc { margin-top: 16px; }
  .carte-corps { padding: 18px; }
  .carte-tete { padding: 14px 18px; border-bottom: 1px solid var(--bord); display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

  /* ---------------------------------------------------------- Boutons */

  button, .bouton {
    font: inherit;
    font-size: 14.5px;
    font-weight: 500;
    padding: 9px 16px;
    border-radius: 7px;
    border: 1px solid var(--bord-fort);
    background: var(--carte);
    color: var(--texte);
    cursor: pointer;
    white-space: nowrap;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    min-height: 40px;
  }

  button:hover, .bouton:hover { border-color: var(--doux); }
  button:focus-visible, .bouton:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible {
    outline: 3px solid var(--orange);
    outline-offset: 2px;
  }

  .principal { background: var(--bouton); border-color: var(--bouton); color: var(--sur-bouton); font-weight: 600; }
  .principal:hover { filter: brightness(1.07); border-color: var(--bouton); }
  .grand { font-size: 16px; padding: 12px 22px; min-height: 50px; border-radius: 9px; white-space: normal; text-align: center; justify-content: center; max-width: 100%; }
  .discret { border-color: transparent; background: transparent; color: var(--doux); padding-inline: 8px; }
  .discret:hover { color: var(--texte); background: var(--neutre-pale); border-color: transparent; }
  .danger { color: var(--alerte); }
  .succes { background: var(--ok); border-color: var(--ok); color: #fff; font-weight: 600; }
  button[disabled] { opacity: 0.45; cursor: not-allowed; filter: none; }

  .actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

  /* ------------------------------------------------------ Formulaires */

  label.champ { display: flex; flex-direction: column; gap: 5px; font-size: 13px; font-weight: 600; color: var(--doux); min-width: 0; }
  label.champ .requis { color: var(--orange-texte); }

  input[type="text"], input[type="number"], input[type="date"], select, textarea {
    font: inherit;
    font-size: 15px;
    font-weight: 400;
    color: var(--texte);
    background: var(--carte);
    border: 1px solid var(--bord-fort);
    border-radius: 7px;
    padding: 9px 11px;
    width: 100%;
    min-height: 42px;
  }

  textarea { min-height: 76px; resize: vertical; }
  input.nombre { text-align: right; font-variant-numeric: tabular-nums; }

  .grille { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; }
  .grille .large { grid-column: 1 / -1; }
  .dims { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }

  .choix-cartes { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; }
  .choix-cartes button { justify-content: flex-start; min-height: 52px; white-space: normal; text-align: left; }
  .choix-cartes button[aria-pressed="true"] { border: 2px solid var(--orange); background: var(--orange-pale); color: var(--texte); }

  .aide { font-size: 13px; color: var(--doux); margin: 0; font-weight: 400; }

  /* ----------------------------------------------- Bandeau des étapes */

  .etapes {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    grid-template-columns: repeat(10, minmax(0, 1fr));
    gap: 6px;
  }

  .etapes button {
    width: 100%;
    flex-direction: column;
    align-items: flex-start;
    gap: 2px;
    padding: 9px 9px 10px;
    min-height: 74px;
    border-radius: 8px;
    white-space: normal;
    text-align: left;
    border: 1px solid var(--bord);
    border-top: 4px solid var(--bord-fort);
    background: var(--carte);
  }

  .etapes .num { font-family: var(--titre); font-size: 20px; font-weight: 500; line-height: 1; color: var(--doux); }
  .etapes .nom { font-size: 12.5px; font-weight: 600; line-height: 1.25; color: var(--texte); }
  .etapes .quand { font-size: 11.5px; color: var(--doux); font-weight: 400; }

  .etapes .faite button { border-top-color: var(--orange); }
  .etapes .faite .num { color: var(--orange-texte); }
  .etapes .courante button { border-top-color: var(--orange); background: var(--orange-pale); border-color: var(--orange); }
  .etapes .courante .num { color: var(--orange-texte); }
  .etapes .avenir button { background: transparent; }
  .etapes .avenir .nom { color: var(--doux); font-weight: 500; }
  .etapes button[aria-current="step"] { outline: 2px solid var(--texte); outline-offset: 1px; }

  /* ---------------------------------------------------- Panneau d'étape */

  .panneau { margin-top: 16px; }

  .citation {
    background: var(--encadre);
    border-left: 4px solid var(--orange);
    border-radius: 0 7px 7px 0;
    padding: 10px 14px;
    margin: 12px 0 18px;
    font-size: 14px;
    color: var(--texte);
  }

  .citation small { display: block; color: var(--doux); font-size: 12px; margin-top: 3px; }

  .pied-etape {
    border-top: 1px solid var(--bord);
    margin-top: 20px;
    padding-top: 16px;
    display: flex;
    gap: 12px;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
  }

  .pied-etape > * { min-width: 0; max-width: 100%; }

  .manques { margin: 0; padding: 10px 14px; border-radius: 7px; background: var(--neutre-pale); font-size: 13.5px; color: var(--doux); }
  .manques ul { margin: 4px 0 0; padding-left: 18px; }

  /* -------------------------------------------------------- Indicateurs */

  .tuiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
  .tuile { background: var(--carte); border: 1px solid var(--bord); border-radius: 10px; padding: 14px 16px; min-width: 0; }
  .tuile .valeur { font-family: var(--titre); font-size: 28px; font-weight: 500; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .tuile .quoi { font-size: 13px; color: var(--doux); margin-top: 3px; }
  .tuile.alerte .valeur { color: var(--alerte); }
  .tuile.bon .valeur { color: var(--ok); }
  .tuile.forte { background: var(--encadre); border-color: var(--orange); }

  .pastille { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 20px; border: 1px solid transparent; white-space: nowrap; }
  .pastille.ok { background: var(--ok-pale); border-color: var(--ok-bord); color: var(--ok); }
  .pastille.attente { background: var(--orange-pale); border-color: var(--orange); color: var(--orange-texte); }
  .pastille.alerte { background: var(--alerte-pale); border-color: var(--alerte-bord); color: var(--alerte); }
  .pastille.neutre { background: var(--neutre-pale); border-color: var(--bord); color: var(--doux); }

  /* ------------------------------------------------- Liste de commandes */

  .filtres { display: flex; gap: 6px; flex-wrap: wrap; margin: 18px 0 12px; }
  .filtres button { min-height: 34px; padding: 5px 11px; font-size: 13px; border-radius: 20px; }
  .filtres button[aria-pressed="true"] { background: var(--texte); border-color: var(--texte); color: var(--fond); }
  .filtres .compte { font-variant-numeric: tabular-nums; opacity: 0.75; }

  .liste-commandes { display: grid; gap: 10px; }

  .fiche {
    display: grid;
    grid-template-columns: minmax(0, 1.4fr) minmax(0, 1.2fr) auto;
    gap: 16px;
    align-items: center;
    padding: 15px 18px;
    background: var(--carte);
    border: 1px solid var(--bord);
    border-radius: 10px;
    text-decoration: none;
    color: inherit;
  }

  .fiche:hover { border-color: var(--orange); }
  .fiche .numero { font-size: 12.5px; color: var(--doux); font-variant-numeric: tabular-nums; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .fiche .client { font-weight: 600; font-size: 16px; margin-top: 2px; }
  .fiche .produit { color: var(--doux); font-size: 14px; }
  .fiche .droite { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 5px; }

  .progression { display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px; margin-bottom: 6px; }
  .progression span { height: 7px; border-radius: 3px; background: var(--neutre-pale); }
  .progression .fait { background: var(--orange); }
  .progression .encours { background: var(--orange); opacity: 0.45; }
  .ou { font-size: 13.5px; }
  .ou strong { font-weight: 600; }

  .vide { padding: 34px 18px; text-align: center; color: var(--doux); }

  /* ---------------------------------------------------- Opérations (OF) */

  .groupe-cat + .groupe-cat { margin-top: 18px; }
  .groupe-cat h4 { margin-bottom: 8px; display: flex; gap: 8px; align-items: center; }
  .groupe-cat h4 .rang { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--orange); color: #fff; font-size: 12px; letter-spacing: 0; }

  .op {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 14px;
    align-items: center;
    padding: 12px 14px;
    border: 1px solid var(--bord);
    border-radius: 9px;
    background: var(--carte);
  }

  .op + .op { margin-top: 8px; }
  .op.encours { border-color: var(--orange); background: var(--orange-pale); }
  .op.terminee { background: var(--ok-pale); border-color: var(--ok-bord); }
  .op .nom-op { font-weight: 600; font-size: 15.5px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .op .details { font-size: 13px; color: var(--doux); margin-top: 2px; }
  .op .jauge { height: 8px; background: var(--neutre-pale); border-radius: 4px; overflow: hidden; margin-top: 8px; max-width: 420px; }
  .op .jauge span { display: block; height: 100%; background: var(--orange); }
  .op.terminee .jauge span { background: var(--ok); }
  .op .qui { font-size: 13px; color: var(--orange-texte); font-weight: 600; margin-top: 5px; }

  .compteur-qte { display: flex; align-items: center; gap: 6px; }
  .compteur-qte button { min-width: 46px; justify-content: center; font-size: 20px; padding: 6px; }
  .compteur-qte input { width: 96px; text-align: center; font-size: 18px; font-weight: 600; }

  .qui-suis-je { display: flex; gap: 8px; flex-wrap: wrap; }
  .qui-suis-je button { min-height: 52px; font-size: 16px; padding-inline: 20px; }
  .qui-suis-je button[aria-pressed="true"] { background: var(--bouton); border-color: var(--bouton); color: var(--sur-bouton); }

  /* ------------------------------------------------------------ Tableaux */

  .defile { overflow-x: auto; max-width: 100%; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--doux); padding: 8px 10px; border-bottom: 1px solid var(--bord); white-space: nowrap; }
  td { padding: 9px 10px; border-bottom: 1px solid var(--bord); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  .nb { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  tfoot td { font-weight: 600; border-top: 2px solid var(--bord-fort); border-bottom: none; }
  .ecart-plus { color: var(--alerte); }
  .ecart-moins { color: var(--ok); }

  /* --------------------------------------------------- Chiffrage, gamme */

  .deux-colonnes { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 18px; align-items: start; }
  .colle { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); }

  .cases { display: grid; gap: 4px; }
  .case {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr) auto;
    gap: 10px;
    align-items: center;
    padding: 8px 10px;
    border: 1px solid var(--bord);
    border-radius: 7px;
    cursor: pointer;
    font-size: 14.5px;
  }

  .case:hover { border-color: var(--bord-fort); }
  .case.coche { border-color: var(--orange); background: var(--orange-pale); }
  .case input { width: 18px; height: 18px; accent-color: var(--orange); margin: 0; }
  .case .temps { font-size: 13px; color: var(--doux); font-variant-numeric: tabular-nums; white-space: nowrap; }

  .resume dl { margin: 0; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 12px; font-size: 14.5px; }
  .resume dt { color: var(--doux); }
  .resume dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; font-weight: 500; }
  .resume .total dt, .resume .total dd { font-weight: 700; color: var(--texte); border-top: 1px solid var(--bord); padding-top: 8px; }

  .grand-chiffre { font-family: var(--titre); font-size: 34px; font-weight: 500; line-height: 1.05; font-variant-numeric: tabular-nums; }

  .fleche-qte { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
  .fleche-qte .sep { font-size: 24px; color: var(--orange); }

  .controles { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
  .controle { border: 1px solid var(--bord); border-radius: 9px; padding: 14px; display: grid; gap: 10px; align-content: start; }
  .controle.ok { border-color: var(--ok-bord); background: var(--ok-pale); }
  .controle.ko { border-color: var(--alerte-bord); background: var(--alerte-pale); }
  .controle.so { opacity: 0.7; }

  .validation { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
  .valide-carte { border: 1px solid var(--bord); border-radius: 9px; padding: 16px; display: grid; gap: 10px; align-content: start; }
  .valide-carte.ok { border-color: var(--ok-bord); background: var(--ok-pale); }

  .sous-onglets { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 16px; }
  .sous-onglets button { min-height: 36px; padding: 6px 14px; font-size: 14px; }
  .sous-onglets button[aria-pressed="true"] { background: var(--texte); border-color: var(--texte); color: var(--fond); }

  .sortie { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; line-height: 1.55; white-space: pre; overflow: auto; max-height: 420px; background: var(--neutre-pale); border: 1px solid var(--bord); border-radius: 7px; padding: 12px; margin: 0; }

  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(18px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%);
    background: var(--texte);
    color: var(--fond);
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 500;
    max-width: calc(100vw - 32px);
    z-index: 20;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.18);
  }

  .toast.erreur { background: var(--alerte); color: #fff; }

  @media (max-width: 980px) {
    .deux-colonnes { grid-template-columns: 1fr; }
    .colle { position: static; }
    .etapes { grid-template-columns: repeat(5, minmax(0, 1fr)); }
    .fiche { grid-template-columns: minmax(0, 1fr); }
    .fiche .droite { align-items: flex-start; text-align: left; flex-direction: row; flex-wrap: wrap; }
  }

  @media (max-width: 520px) {

        var nom = String(etat.brouillons["ajout:" + opts.collection] || "").trim();
        if (!nom) return;
        if (opts.elements.some(function (x) { return x.nom.toLowerCase() === nom.toLowerCase(); })) { signaler("« " + nom + " » existe déjà.", true); return; }
        creer(opts.collection + "/" + slug(nom), { nom: nom }, opts.ajoute).then(function () {
          delete etat.brouillons["ajout:" + opts.collection];
          planifierRendu();
        }).catch(function () { /* déjà signalé */ });
      }
    },
      h("label", { class: "champ", for: idChamp, style: { flex: "1 1 240px" } }, opts.libelle,
        h("input", {
          type: "text", id: idChamp, placeholder: opts.indice, disabled: !peutEcrire,
          value: etat.brouillons["ajout:" + opts.collection] || "",
          oninput: function (ev) { etat.brouillons["ajout:" + opts.collection] = ev.target.value; }
        })),
      h("button", { type: "submit", class: "principal", disabled: !peutEcrire, style: { alignSelf: "flex-end" } }, "Ajouter"));
    carte.appendChild(form);

    if (!opts.elements.length) {
      carte.appendChild(h("p", { class: "vide" }, opts.vide));
    } else {
      carte.appendChild(h("div", { class: "defile", style: { marginTop: "14px" } }, h("table", null, h("tbody", null, opts.elements.map(function (x) {
        var cle = "suppr-" + opts.collection + "-" + x.id;
        var usage = opts.usage ? opts.usage(x) : 0;
        return h("tr", null,
          h("td", null, h("strong", null, x.nom)),
          h("td", { class: "aide" }, opts.usageTexte ? opts.usageTexte(usage) : ""),
          h("td", { class: "nb" }, etat.confirmation === cle
            ? h("div", { class: "actions", style: { justifyContent: "flex-end" } },
              bouton("Supprimer", function () { etat.confirmation = null; supprimer(opts.collection + "/" + x.id, opts.supprime); }, { classe: "danger" }),
              bouton("Garder", function () { etat.confirmation = null; rendre(); }, { classe: "discret", ecriture: false }))
            : bouton("Supprimer", function () {
              if (usage && opts.bloque) { signaler(opts.bloque(x, usage), true); return; }
              etat.confirmation = cle; rendre();
            }, { classe: "discret danger" })));
      })))));
    }
    racine.appendChild(carte);
  }

  function reglagesCentres(racine) {
    listeSimple(racine, {
      collection: "centres", elements: etat.centres, libelle: "Nouveau centre de travail", indice: "Scie à format",
      aide: "Scie, toupie, ponceuse, cabine de finition, poste d'assemblage, laser… Chaque opération se fait sur l'un d'eux.",
      vide: "Aucun centre de travail.", ajoute: "Centre de travail ajouté", supprime: "Centre de travail supprimé",
      usage: function (x) { return etat.operations.filter(function (op) { return op.centreTravail === x.nom; }).length; },
      usageTexte: function (n) { return n ? n + " opération" + (n > 1 ? "s" : "") : "Aucune opération"; },
      bloque: function (x, n) { return "« " + x.nom + " » est utilisé par " + n + " opération" + (n > 1 ? "s" : "") + ". Changez-les d'abord dans l'onglet Opérations."; }
    });
  }

  function reglagesOperateurs(racine) {
    listeSimple(racine, {
      collection: "operateurs", elements: etat.operateurs, libelle: "Nouvel opérateur", indice: "Prénom",
      aide: "Les personnes de l'atelier. Elles se choisissent d'un geste sur la tablette pour pointer.",
      vide: "Aucun opérateur : sur la tablette, chacun tapera son nom.", ajoute: "Opérateur ajouté", supprime: "Opérateur retiré",
      usage: function (x) { return etat.pointages.filter(function (pt) { return pt.operateur === x.nom; }).length; },
      usageTexte: function (n) { return n ? n + " pointage" + (n > 1 ? "s" : "") : ""; }
    });
  }

  function reglagesParametres(racine) {
    var defs = [
      [CLE_TAUX, "Taux horaire atelier (€ HT, par salarié)", "Multiplie les heures de main-d'œuvre."],
      [CLE_MAJ, "Majoration des quantités lancées", "0.05 pour +5 %, pour absorber les rebuts."],
      [CLE_REGLAGE, "Temps de réglage par défaut (min)", "Compté une seule fois par opération."]
    ];
    var carte = h("div", { class: "carte carte-corps" });
    carte.appendChild(h("div", { class: "grille" }, defs.map(function (d) {
      var id = "param-" + d[0];
      var cleP = "param:" + d[0];
      var liaisonP = brouillon(cleP, function (saisie) {
        var v = String(saisie).trim();
        if (v !== "" && versEchelle(v, 4) === null) { signaler("« " + v + " » n'est pas un nombre valide.", true); return false; }
        v = v.replace(",", ".");
        if (v === (etat.parametres[d[0]] || "")) return null;
        creer("parametres/" + d[0], { valeur: v, description: d[1] }, "Paramètre enregistré").catch(function () { /* déjà signalé */ });
        return v;
      });
      return h("label", { class: "champ", for: id }, d[1],
        h("input", {
          type: "text", id: id, inputmode: "decimal", class: "nombre", disabled: !peutEcrire,
          value: etat.brouillons[cleP] !== undefined ? etat.brouillons[cleP] : etat.parametres[d[0]] || "",
          placeholder: "à renseigner",
          oninput: liaisonP.oninput, onchange: liaisonP.onchange, onblur: liaisonP.onblur
        }),
        h("span", { class: "aide" }, d[2]));
    })));
    racine.appendChild(carte);
  }

  function csv(v) {
    var t = v === null || v === undefined ? "" : String(v);
    return /[",\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t;
  }

  function reglagesExport(racine) {
    var lignes = ["nom,temps_unitaire_min,temps_reglage_min,nb_operateurs,centre_travail,categorie"];
    var ignorees = 0;
    etat.operations.slice().sort(function (a, b) { return a.ordre - b.ordre; }).forEach(function (op) {
      var cat = op.categorie && op.categorieSource !== "proposition" ? op.categorie : "";
      if (op.categorie && op.categorieSource === "proposition") ignorees += 1;
      lignes.push([csv(op.nom), csv(op.tempsUnitaireMin), csv(op.tempsReglageMin), csv(op.nbOperateurs), csv(op.centreTravail || ""), csv(cat)].join(","));
    });
    var texte = lignes.join("\n") + "\n";
    var pre = h("pre", { class: "sortie", id: "csv" }, texte);
    var carte = h("div", { class: "carte carte-corps" },
      h("p", { class: "aide", style: { marginBottom: "10px" } },
        "Cet aperçu a son propre stockage. Copiez ce fichier dans data/operations.csv du dépôt, puis lancez npm run seed : les affectations passent dans la vraie base."
        + (ignorees ? " Les " + ignorees + " catégories « à confirmer » ne sont pas exportées tant que vous ne les avez pas confirmées." : "")),
      h("div", { class: "actions", style: { marginBottom: "10px" } }, bouton("Copier le CSV", function () {
        var ok = function () { signaler("CSV copié"); };
        var repli = function () {
          try { var r = document.createRange(); r.selectNodeContents(pre); var s = window.getSelection(); s.removeAllRanges(); s.addRange(r); } catch (e) { /* rien */ }
          signaler("Copie refusée : le texte est sélectionné, copiez-le à la main.", true);
        };
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(texte).then(ok, repli); else repli();
      }, { classe: "principal", ecriture: false })),
      pre);
    racine.appendChild(carte);
  }

  // ===================================================================
  // Chronomètres des opérations en cours
  // ===================================================================

  function rafraichirChronos() {
    var maintenantMs = Date.now();
    document.querySelectorAll("[data-debut]").forEach(function (n) {
      var debut = Date.parse(n.dataset.debut);
      if (isNaN(debut)) return;
      var min = Math.max(0, Math.floor((maintenantMs - debut) / 60000));
      n.textContent = min < 1 ? "depuis moins d'une minute" : min < 60 ? "depuis " + min + " min" : "depuis " + Math.floor(min / 60) + " h " + String(min % 60).padStart(2, "0");
    });
  }

  window.setInterval(rafraichirChronos, 20000);

  // ===================================================================
  // Navigation
  // ===================================================================

  function lireRoute() {
    var hsh = (window.location.hash || "").slice(1);
    if (hsh === "atelier" || hsh === "reglages" || hsh === "nouvelle") return { vue: hsh };
    if (hsh.indexOf("commande-") === 0) return { vue: "commande", id: hsh.slice(9) };
    return { vue: "commandes" };
  }

  window.addEventListener("hashchange", function () {
    etat.route = lireRoute();
    etat.confirmation = null;
    etat.fin = null;
    rendre();
  });

  // ===================================================================
  // Démarrage : abonnements aux données
  // ===================================================================

  etat.route = lireRoute();
  rendre();

  var minuteur = window.setTimeout(function () {
    if (!etat.pret.ops || !etat.pret.cmd) { etat.lent = true; rendre(); }
  }, 10000);

  function recu() {
    if (etat.pret.ops && etat.pret.cmd) window.clearTimeout(minuteur);
    planifierRendu();
  }

  function echec(e) {
    window.clearTimeout(minuteur);
    etat.erreur = texteErreur(e);
    rendre();
  }

  function normaliserCommande(id, d) {
    return Object.assign({
      numero: "", client: "", produit: "", quantite: 0, echeance: "", typologie: "standard",
      famille: "", essence: "", finition: "", marquage: "aucun", notes: "",
      etape: 1, historique: {}, gamme: [], prixUnitaireHT: "", coutMatiereEstime: "",
      prototypeRequis: true, controles: {}, clos: false
    }, d, { id: id, etape: Math.min(10, Math.max(1, Number(d.etape) || 1)) });
  }

  if (!window.claude || typeof window.claude.use !== "function") {
    window.setTimeout(function () {
      window.clearTimeout(minuteur);
      etat.erreur = "Cette page a besoin du stockage de l'artefact, indisponible ici.";
      rendre();
    }, 1500);
    return;
  }

  window.claude.use("user").then(function (u) {
    if (!u || typeof u.can !== "function") return;
    return u.can("data.write").then(function (droit) { if (droit === false) { peutEcrire = false; planifierRendu(); } });
  }).catch(function () { /* sans information, les champs restent actifs */ });

  window.claude.use("db").then(function (db) {
    if (!db) {
      window.clearTimeout(minuteur);
      etat.erreur = "Les données ne sont pas accessibles depuis cette vue. Essayez en étant connecté.";
      rendre();
      return;
    }
    magasin = db;

    db.collection("operations").orderBy("ordre").onSnapshot(function (snap) {
      etat.operations = snap.docs.map(function (d) {
        var v = d.data() || {};
        return {
          id: d.id, nom: v.nom || d.id, ordre: typeof v.ordre === "number" ? v.ordre : 0,
          tempsUnitaireMin: v.tempsUnitaireMin, tempsReglageMin: v.tempsReglageMin,
          nbOperateurs: typeof v.nbOperateurs === "number" ? v.nbOperateurs : 1,
          centreTravail: v.centreTravail || null, categorie: v.categorie || null,
          categorieSource: v.categorieSource || (v.categorie ? "gerant" : null),
          actif: v.actif !== false
        };
      });
      etat.opParId = {};
      etat.operations.forEach(function (op) { etat.opParId[op.id] = op; });
      etat.pret.ops = true;
      recu();
    }, echec);

    db.collection("commandes").onSnapshot(function (snap) {
      etat.commandes = snap.docs.map(function (d) { return normaliserCommande(d.id, d.data() || {}); });
      etat.cmdParId = {};
      etat.commandes.forEach(function (c) { etat.cmdParId[c.id] = c; });
      etat.pret.cmd = true;
      purgerBrouillons();
      recu();
    }, echec);

    db.collection("pointages").onSnapshot(function (snap) {
      etat.pointages = snap.docs.map(function (d) { var v = d.data() || {}; v.id = d.id; return v; });
      etat.pret.pt = true;
      if (etat.fin && !etat.pointages.some(function (pt) { return pt.id === etat.fin.pointageId && !pt.fin; })) etat.fin = null;
      recu();
    }, function (e) { signaler(texteErreur(e), true); });

    db.collection("centres").orderBy("nom").onSnapshot(function (snap) {
      etat.centres = snap.docs.map(function (d) { var v = d.data() || {}; return { id: d.id, nom: v.nom || d.id }; });
      planifierRendu();
    }, function (e) { signaler(texteErreur(e), true); });

    db.collection("operateurs").orderBy("nom").onSnapshot(function (snap) {
      etat.operateurs = snap.docs.map(function (d) { var v = d.data() || {}; return { id: d.id, nom: v.nom || d.id }; });
      planifierRendu();
    }, function (e) { signaler(texteErreur(e), true); });

    db.collection("parametres").onSnapshot(function (snap) {
      var p = {};
      snap.docs.forEach(function (d) { var v = d.data() || {}; p[d.id] = v.valeur === undefined || v.valeur === null ? "" : String(v.valeur); });
      etat.parametres = p;
      purgerBrouillons();
      planifierRendu();
    }, function (e) { signaler(texteErreur(e), true); });
  }).catch(echec);
})();
</script>
