<title>ERP Full Pack Services</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Jost:wght@300;400;500;600&display=swap">
<style>
  /* Un volet de navigation sombre à gauche, le travail à droite. Couleurs du
     document « Notre processus de fabrication » : orange Full Pack,
     anthracite, fond chaud des encadrés. Les graphiques prennent la paire
     bleu / orange validée pour la vision des couleurs. */
  :root {
    --fond: #f6f4f1;
    --carte: #ffffff;
    --encadre: #fbf4ee;
    --volet: #2b2a28;
    --volet-actif: #3d3b38;
    --volet-texte: #f3f0ec;
    --volet-doux: #a59e96;

    --texte: #262422;
    --doux: #6f6962;
    --pale: #8f8880;
    --bord: #e3ded7;
    --bord-fort: #cbc4ba;

    --orange: #e8772e;
    --bouton: #b4540f;
    --sur-bouton: #ffffff;
    --orange-pale: #fcece0;
    --orange-texte: #9a4610;

    --ok: #2e7d4f;
    --ok-pale: #e6f4ec;
    --ok-bord: #bfe0cc;
    --alerte: #b3261e;
    --alerte-pale: #fbe9e7;
    --alerte-bord: #f0c4bf;
    --neutre-pale: #efedea;

    --serie-1: #2a78d6;
    --serie-2: #eb6834;
    --positif: #2a78d6;
    --negatif: #e34948;
    --statut-bon: #0ca30c;
    --statut-juste: #fab219;
    --statut-critique: #d03b3b;
    --grille: #e1e0d9;
    --axe: #c3c2b7;
    --p-gris: #ecebe8;
    --p-jaune: #f9efc9;
    --p-orange: #fbe3d1;
    --p-bleu: #dceaf8;
    --rouge-auj: #e5484d;

    --titre: "Jost", ui-sans-serif, system-ui, sans-serif;
    --corps: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --fond: #171513;
      --carte: #211e1b;
      --encadre: #2a221b;
      --volet: #0f0e0d;
      --volet-actif: #2b2825;
      --volet-texte: #f3f0ec;
      --volet-doux: #9d968e;
      --texte: #eeeae4;
      --doux: #aba39a;
      --pale: #8c857d;
      --bord: #36312b;
      --bord-fort: #4b443c;
      --orange: #f08a45;
      --bouton: #f08a45;
      --sur-bouton: #1a1512;
      --orange-pale: #3a2616;
      --orange-texte: #f6ad78;
      --ok: #7cc79a;
      --ok-pale: #17291e;
      --ok-bord: #2b4a37;
      --alerte: #f08c80;
      --alerte-pale: #3a1c19;
      --alerte-bord: #5e2a24;
      --neutre-pale: #2a2724;
      --serie-1: #3987e5;
      --serie-2: #d95926;
      --positif: #3987e5;
      --negatif: #e66767;
      --statut-bon: #0ca30c;
      --statut-juste: #fab219;
      --statut-critique: #d03b3b;
      --grille: #2c2c2a;
      --axe: #4a453f;
      --p-gris: #35332f;
      --p-jaune: #44391b;
      --p-orange: #4a3020;
      --p-bleu: #1f3550;
      --rouge-auj: #ef6b6f;
      color-scheme: dark;
    }
  }

  :root[data-theme="dark"] {
    --fond: #171513;
    --carte: #211e1b;
    --encadre: #2a221b;
    --volet: #0f0e0d;
    --volet-actif: #2b2825;
    --volet-texte: #f3f0ec;
    --volet-doux: #9d968e;
    --texte: #eeeae4;
    --doux: #aba39a;
    --pale: #8c857d;
    --bord: #36312b;
    --bord-fort: #4b443c;
    --orange: #f08a45;
    --bouton: #f08a45;
    --sur-bouton: #1a1512;
    --orange-pale: #3a2616;
    --orange-texte: #f6ad78;
    --ok: #7cc79a;
    --ok-pale: #17291e;
    --ok-bord: #2b4a37;
    --alerte: #f08c80;
    --alerte-pale: #3a1c19;
    --alerte-bord: #5e2a24;
    --neutre-pale: #2a2724;
    --serie-1: #3987e5;
    --serie-2: #d95926;
    --positif: #3987e5;
    --negatif: #e66767;
    --statut-bon: #0ca30c;
    --statut-juste: #fab219;
    --statut-critique: #d03b3b;
    --grille: #2c2c2a;
    --axe: #4a453f;
    --p-gris: #35332f;
    --p-jaune: #44391b;
    --p-orange: #4a3020;
    --p-bleu: #1f3550;
    --rouge-auj: #ef6b6f;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--fond);
    color: var(--texte);
    font-family: var(--corps);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  /* ------------------------------------------------- Structure à volet */

  .appli { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100vh; background: linear-gradient(90deg, var(--volet) 236px, transparent 236px); }

  .volet {
    background: var(--volet);
    color: var(--volet-texte);
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
    padding-block: 18px 22px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: 14px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .logo { display: block; text-decoration: none; color: inherit; }
  .logo-plaque { display: block; background: #fff; border-radius: 12px; padding: 10px 12px; width: fit-content; max-width: 100%; }
  .logo-plaque img { display: block; width: 150px; height: auto; max-width: 100%; }
  .logo-plaque.petit img { width: 120px; }
  .logo .barre { width: 4px; height: 32px; background: var(--orange); border-radius: 2px; }
  .logo .mot { font-family: var(--titre); font-weight: 300; font-size: 21px; letter-spacing: 0.06em; line-height: 1; }
  .logo .mot b { font-weight: 400; color: var(--orange); }
  .logo .sous { display: block; font-family: var(--titre); font-size: 11px; letter-spacing: 0.32em; color: var(--orange); margin-top: 3px; }

  .nav { display: flex; flex-direction: column; gap: 3px; }
  .nav a {
    display: flex;
    align-items: center;
    gap: 11px;
    color: var(--volet-texte);
    text-decoration: none;
    font-size: 15px;
    font-weight: 500;
    padding: 10px 12px;
    border-radius: 8px;
    opacity: 0.82;
  }
  .nav a:hover { background: var(--volet-actif); opacity: 1; }
  .nav a[aria-current="page"] { background: var(--volet-actif); opacity: 1; box-shadow: inset 3px 0 0 var(--orange); }
  .nav svg { width: 19px; height: 19px; flex: none; }
  .nav .compte { margin-left: auto; font-size: 12px; font-variant-numeric: tabular-nums; background: var(--orange); color: #1a1512; border-radius: 10px; padding: 0 7px; font-weight: 700; }

  .volet .nouvelle { justify-content: center; }
  .volet .bas-volet { margin-top: auto; padding: 0 6px; }
  .volet .pied { font-size: 12px; color: var(--volet-doux); margin: 0; }

  main {
    padding-block: 26px 80px;
    padding-left: 28px;
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    min-width: 0;
  }

  .page { max-width: 1320px; margin: 0 auto; min-width: 0; }

  /* --------------------------------------------------------- Textes */

  h1 { font-family: var(--titre); font-weight: 500; font-size: 28px; margin: 0; text-wrap: balance; }
  h2 { font-family: var(--titre); font-weight: 500; font-size: 19px; margin: 0; text-wrap: balance; }
  h3 { font-family: var(--titre); font-weight: 500; font-size: 16px; margin: 0; }
  h4 { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em; color: var(--doux); margin: 0; }

  .titre-page { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-bottom: 18px; }
  .sous-titre { color: var(--doux); margin: 4px 0 0; }
  .retour { display: inline-block; color: var(--doux); text-decoration: none; font-size: 13.5px; margin-bottom: 8px; }
  .retour:hover { color: var(--texte); }
  .aide { font-size: 13px; color: var(--doux); margin: 0; font-weight: 400; }
  .mono { font-variant-numeric: tabular-nums; }

  .carte { background: var(--carte); border: 1px solid var(--bord); border-radius: 10px; min-width: 0; }
  .carte-corps { padding: 18px; }
  .carte-tete { padding: 14px 18px; border-bottom: 1px solid var(--bord); display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .pile { display: grid; gap: 16px; }

  /* --------------------------------------------------------- Boutons */

  button, .bouton {
    font: inherit;
    font-size: 14.5px;
    font-weight: 500;
    padding: 9px 16px;
    border-radius: 7px;
    border: 1px solid var(--bord-fort);
    background: var(--carte);
    color: var(--texte);
    cursor: pointer;
    white-space: nowrap;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    min-height: 40px;
  }
  button:hover, .bouton:hover { border-color: var(--doux); }
  button:focus-visible, .bouton:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible, canvas:focus-visible, summary:focus-visible {
    outline: 3px solid var(--orange);
    outline-offset: 2px;
  }
  .principal { background: var(--bouton); border-color: var(--bouton); color: var(--sur-bouton); font-weight: 600; }
  .principal:hover { filter: brightness(1.07); border-color: var(--bouton); }
  .grand { font-size: 16px; padding: 12px 22px; min-height: 50px; border-radius: 9px; white-space: normal; text-align: center; justify-content: center; max-width: 100%; }
  .petit { min-height: 32px; padding: 4px 10px; font-size: 13px; }
  .discret { border-color: transparent; background: transparent; color: var(--doux); padding-inline: 8px; }
  .discret:hover { color: var(--texte); background: var(--neutre-pale); border-color: transparent; }
  .danger { color: var(--alerte); }
  .succes { background: var(--ok); border-color: var(--ok); color: #fff; font-weight: 600; }
  button[disabled] { opacity: 0.45; cursor: not-allowed; filter: none; }
  button[aria-pressed="true"].bascule { background: var(--texte); border-color: var(--texte); color: var(--fond); }

  .actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

  /* ----------------------------------------------------- Formulaires */

  label.champ, .champ { display: flex; flex-direction: column; gap: 5px; font-size: 13px; font-weight: 600; color: var(--doux); min-width: 0; }
  .champ .requis { color: var(--orange-texte); }

  input[type="text"], input[type="number"], input[type="date"], select, textarea {
    font: inherit;
    font-size: 15px;
    font-weight: 400;
    color: var(--texte);
    background: var(--carte);
    border: 1px solid var(--bord-fort);
    border-radius: 7px;
    padding: 8px 10px;
    width: 100%;
    min-height: 40px;
  }
  textarea { min-height: 72px; resize: vertical; }
  input.nombre { text-align: right; font-variant-numeric: tabular-nums; }
  input[type="range"] { width: 100%; accent-color: var(--orange); min-height: 28px; }

  .grille { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }
  .grille .large { grid-column: 1 / -1; }
  .dims { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
  .dims4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }

  .choix-cartes { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; }
  .choix-cartes button { justify-content: flex-start; min-height: 50px; white-space: normal; text-align: left; }
  .choix-cartes button[aria-pressed="true"] { border: 2px solid var(--orange); background: var(--orange-pale); color: var(--texte); }

  /* ----------------------------------------------- Bandeau des étapes */

  .etapes { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 6px; }
  .etapes button {
    width: 100%;
    flex-direction: column;
    align-items: flex-start;
    gap: 2px;
    padding: 8px 9px 9px;
    min-height: 70px;
    border-radius: 8px;
    white-space: normal;
    text-align: left;
    border: 1px solid var(--bord);
    border-top: 4px solid var(--bord-fort);
    background: var(--carte);
  }
  .etapes .num { font-family: var(--titre); font-size: 19px; font-weight: 500; line-height: 1; color: var(--doux); }
  .etapes .nom { font-size: 12.5px; font-weight: 600; line-height: 1.25; color: var(--texte); }
  .etapes .quand { font-size: 11.5px; color: var(--doux); font-weight: 400; }
  .etapes .faite button { border-top-color: var(--orange); }
  .etapes .faite .num { color: var(--orange-texte); }
  .etapes .courante button { border-top-color: var(--orange); background: var(--orange-pale); border-color: var(--orange); }
  .etapes .courante .num { color: var(--orange-texte); }
  .etapes .avenir button { background: transparent; }
  .etapes .avenir .nom { color: var(--doux); font-weight: 500; }
  .etapes button[aria-current="step"] { outline: 2px solid var(--texte); outline-offset: 1px; }

  .panneau { margin-top: 16px; }
  .citation { background: var(--encadre); border-left: 4px solid var(--orange); border-radius: 0 7px 7px 0; padding: 10px 14px; margin: 12px 0 18px; font-size: 14px; }
  .citation small { display: block; color: var(--doux); font-size: 12px; margin-top: 3px; }

  .pied-etape { border-top: 1px solid var(--bord); margin-top: 20px; padding-top: 16px; display: flex; gap: 12px; justify-content: space-between; align-items: center; flex-wrap: wrap; }
  .pied-etape > * { min-width: 0; max-width: 100%; }
  .manques { margin: 0; padding: 10px 14px; border-radius: 7px; background: var(--neutre-pale); font-size: 13.5px; color: var(--doux); }
  .manques ul { margin: 4px 0 0; padding-left: 18px; }
  .bandeau-info { padding: 12px 16px; border-radius: 9px; background: var(--alerte-pale); border: 1px solid var(--alerte-bord); color: var(--texte); display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }

  .onglets-int { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 16px; border-bottom: 1px solid var(--bord); }
  .onglets-int button { border: none; border-bottom: 3px solid transparent; border-radius: 0; background: transparent; padding: 10px 14px; font-size: 15px; min-height: 44px; }
  .onglets-int button[aria-pressed="true"] { border-bottom-color: var(--orange); color: var(--texte); font-weight: 600; }

  /* ------------------------------------------------------ Indicateurs */

  .tuiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
  .tuiles.sept { grid-template-columns: repeat(7, minmax(0, 1fr)); }
  @media (max-width: 1280px) { .tuiles.sept { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  @media (max-width: 600px) { .tuiles.sept { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .adapte { width: 100%; min-width: 0; }
  .tuile { background: var(--carte); border: 1px solid var(--bord); border-radius: 10px; padding: 14px 16px; min-width: 0; }
  .tuile .valeur { font-family: var(--corps); font-size: 25px; font-weight: 600; line-height: 1.15; letter-spacing: -0.01em; }
  .tuile .quoi { font-size: 13px; color: var(--doux); margin-top: 3px; }
  .tuile .plus { font-size: 12.5px; color: var(--doux); margin-top: 6px; }
  .tuile.alerte .valeur { color: var(--alerte); }
  .tuile.bon .valeur { color: var(--ok); }
  .heros { background: var(--carte); border: 1px solid var(--bord); border-radius: 12px; padding: 20px 22px; display: flex; flex-wrap: wrap; gap: 14px 40px; align-items: flex-end; justify-content: space-between; }
  .heros .valeur { font-size: 50px; font-weight: 600; line-height: 1; letter-spacing: -0.02em; }
  .heros .quoi { font-size: 14px; color: var(--doux); margin-top: 6px; }

  .pastille { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 20px; border: 1px solid transparent; white-space: nowrap; }
  .pastille.ok { background: var(--ok-pale); border-color: var(--ok-bord); color: var(--ok); }
  .pastille.attente { background: var(--orange-pale); border-color: var(--orange); color: var(--orange-texte); }
  .pastille.alerte { background: var(--alerte-pale); border-color: var(--alerte-bord); color: var(--alerte); }
  .pastille.neutre { background: var(--neutre-pale); border-color: var(--bord); color: var(--doux); }

  /* ------------------------------------------------ Liste de commandes */

  .filtres { display: flex; gap: 6px; flex-wrap: wrap; margin: 18px 0 12px; }
  .filtres button { min-height: 34px; padding: 5px 11px; font-size: 13px; border-radius: 20px; }
  .filtres button[aria-pressed="true"] { background: var(--texte); border-color: var(--texte); color: var(--fond); }
  .filtres .compte { font-variant-numeric: tabular-nums; opacity: 0.75; }

  .liste-commandes { display: grid; gap: 10px; }
  .fiche { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1.2fr) auto; gap: 16px; align-items: center; padding: 15px 18px; background: var(--carte); border: 1px solid var(--bord); border-radius: 10px; text-decoration: none; color: inherit; }
  .fiche:hover { border-color: var(--orange); }
  .fiche .numero { font-size: 12.5px; color: var(--doux); font-variant-numeric: tabular-nums; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .fiche .client { font-weight: 600; font-size: 16px; margin-top: 2px; }
  .fiche .produit { color: var(--doux); font-size: 14px; }
  .fiche .droite { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 5px; }
  .progression { display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px; margin-bottom: 6px; }
  .progression span { height: 7px; border-radius: 3px; background: var(--neutre-pale); }
  .progression .fait { background: var(--orange); }
  .progression .encours { background: var(--orange); opacity: 0.45; }
  .ou { font-size: 13.5px; }
  .vide { padding: 30px 18px; text-align: center; color: var(--doux); }

  /* ----------------------------------------------- Pièces du coffret */

  .atelier3d { display: grid; grid-template-columns: minmax(0, 0.85fr) minmax(0, 1.15fr); gap: 18px; align-items: start; }
  .colonne-3d { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 14px); display: grid; gap: 12px; }
  .palette { display: flex; flex-wrap: wrap; gap: 6px; }
  .palette button { min-height: 36px; padding: 5px 11px; font-size: 13.5px; }

  .nomenclature { display: grid; gap: 8px; }
  .piece { border: 1px solid var(--bord); border-radius: 9px; background: var(--carte); }
  .piece.selection { border: 2px solid var(--orange); }
  .piece-tete { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 12px; cursor: pointer; width: 100%; border: none; background: transparent; text-align: left; min-height: 56px; border-radius: 9px; white-space: normal; }
  .piece-tete:hover { background: var(--neutre-pale); }
  .piece .code { font-family: var(--titre); font-weight: 600; font-size: 14px; min-width: 46px; padding: 3px 7px; border-radius: 6px; text-align: center; color: #1a1512; }
  .piece .resume-p { font-size: 12.5px; color: var(--doux); }
  .piece .libelle-p { font-weight: 600; font-size: 14.5px; color: var(--texte); }
  .piece-corps { padding: 4px 14px 16px; display: grid; gap: 14px; border-top: 1px solid var(--bord); }

  .puces { display: flex; flex-wrap: wrap; gap: 5px; }
  .puces button { min-height: 32px; padding: 4px 10px; font-size: 13px; border-radius: 16px; }
  .puces button[aria-pressed="true"] { background: var(--orange-pale); border-color: var(--orange); color: var(--texte); }
  .cat-titre { display: flex; align-items: center; gap: 8px; margin: 8px 0 5px; }
  .rang { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--orange); color: #1a1512; font-size: 12px; font-weight: 700; flex: none; }

  .ops-choisies { display: grid; gap: 6px; }
  .op-choisie { display: grid; grid-template-columns: minmax(0, 1fr) auto auto auto; gap: 8px; align-items: center; padding: 7px 10px; border-radius: 8px; background: var(--encadre); font-size: 14px; }
  .pas { display: inline-flex; align-items: center; gap: 4px; }
  .pas button { min-width: 34px; min-height: 34px; padding: 2px; justify-content: center; font-size: 17px; }
  .pas span { min-width: 44px; text-align: center; font-weight: 600; font-variant-numeric: tabular-nums; }

  /* ------------------------------------------------- Ordres de fabrication */

  .of { border: 1px solid var(--bord); border-radius: 10px; background: var(--carte); }
  .of + .of { margin-top: 12px; }

  // ===================================================================
  // Arithmétique exacte : entiers d'unités fines, jamais de flottant pour
  // un temps ou un montant. Centièmes de minute, centimes d'euro.
  // ===================================================================

  var FINE = " ";

  function versEchelle(texte, decimales) {
    var t = String(texte === null || texte === undefined ? "" : texte).trim().replace(",", ".");
    if (!/^\d+(\.\d+)?$/.test(t)) return null;
    var p = t.split(".");
    var frac = ((p[1] || "") + "0000000000").slice(0, decimales);
    return Number(p[0]) * Math.pow(10, decimales) + Number(frac || "0");
  }

  function grouper(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, FINE); }

  function formater(valeur, echelle, decMin) {
    if (valeur === null || valeur === undefined || isNaN(valeur)) return "—";
    var f = Math.pow(10, echelle);
    var neg = valeur < 0;
    var abs = Math.abs(Math.round(valeur));
    var ent = Math.floor(abs / f);
    var frac = String(abs % f).padStart(echelle, "0").replace(/0+$/, "");
    while (frac.length < (decMin || 0)) frac += "0";
    return (neg ? "-" : "") + grouper(ent) + (frac ? "," + frac : "");
  }

  function minutes(c) { return c === null || c === undefined ? "—" : formater(c, 2, 0) + FINE + "min"; }

  function duree(c) {
    if (c === null || c === undefined) return "—";
    if (c < 6000) return minutes(c);
    var tot = Math.round(c / 100);
    var hrs = Math.floor(tot / 60);
    return grouper(hrs) + FINE + "h" + FINE + String(tot - hrs * 60).padStart(2, "0");
  }

  function heuresTexte(c) { return c === null ? "—" : formater(Math.round(c / 60), 2, 0) + FINE + "h"; }
  function euros(c) { return c === null || c === undefined ? "—" : formater(c, 2, 2) + FINE + "€"; }
  function eurosRonds(c) { return c === null || c === undefined ? "—" : grouper(Math.round(c / 100)) + FINE + "€"; }
  function pourMille(pm) { return pm === null || pm === undefined ? "—" : formater(pm, 1, 0) + FINE + "%"; }
  function mm(v) { var n = Number(v); return isNaN(n) || v === "" ? "—" : formater(Math.round(n * 10), 1, 0); }

  function quantiteLancee(qte, majDixMill) { return Math.ceil((qte * (10000 + majDixMill)) / 10000); }

  // temps prévu = réglage + unitaire × pièces × passages.
  // Le réglage est compté une seule fois par opération et par ordre de
  // fabrication (ici : par pièce), jamais par pièce produite ni par passage.
  function tempsOp(op, pieces, passages) {
    var u = versEchelle(op.tempsUnitaireMin, 2);
    var r = versEchelle(op.tempsReglageMin, 2);
    if (u === null || r === null) return null;
    return r + u * pieces * passages;
  }

  function coutMO(minutesC, tauxC) {
    if (tauxC === null) return null;
    return Math.round((minutesC * tauxC) / 6000);
  }

  // ===================================================================

  // Le travail d'une commande : une ligne par pièce et par opération.

    var lancee = lanceeDe(cmd);
    var res = [];
    piecesDe(cmd).forEach(function (p) {
      var parCoffret = p.genre === "coffret" ? 1 : Math.max(0, Math.floor(Number(p.qte)) || 0);
      var quantite = lancee * parCoffret;
      (p.ops || []).forEach(function (o) {
        var op = etat.opParId[o.op];
        if (!op) return;
        var n = Math.max(1, Math.floor(Number(o.n)) || 1);

    var parPiece = {};

  function pointagesDe(cmd) { return etat.pointages.filter(function (p) { return p.commandeId === cmd.id; }); }

    });

  function chiffrage(cmd) {

    };

  function rebuts(cmd) {
    var t = 0;

  // ===================================================================

  function travailRestant(cmd) {

  function prochainJourOuvre(d) {
    var r = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    while (r.getDay() === 0 || r.getDay() === 6) r.setDate(r.getDate() + 1);
    return r;
  }

  function ajouterJoursOuvres(d, jours) {
    var r = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    var reste = Math.ceil(jours);
    while (reste > 0) {
      r.setDate(r.getDate() + 1);
      if (r.getDay() !== 0 && r.getDay() !== 6) reste -= 1;
    }
    return r;
  }

  function joursOuvresEntre(a, b) {
    var n = 0, r = new Date(a.getFullYear(), a.getMonth(), a.getDate());
    var sens = b >= a ? 1 : -1;
    while ((sens > 0 && r < b) || (sens < 0 && r > b)) {
      r.setDate(r.getDate() + sens);
      if (r.getDay() !== 0 && r.getDay() !== 6) n += sens;
    }
    return n;
  }

  // Ordonnancement : les commandes sont prises par date de livraison. Une
  // commande déplacée à la main dans le planning garde sa date de début ;
  // les autres se placent l'une après l'autre sur la capacité de l'atelier.
  // Durée d'une commande = travail restant ÷ capacité journalière.
  function planning() {
    var capJour = Math.round((nbOperateursAtelier() * heuresSemaine() * 60) / 5);
    var file = etat.commandes.filter(function (c) { return active(c) && c.etape <= 6 && c.etape >= 2; })
      .sort(function (a, b) {
        var ea = a.echeance || "9999", eb = b.echeance || "9999";
        return ea < eb ? -1 : ea > eb ? 1 : (a.numero < b.numero ? -1 : 1);
      });
    var depart = prochainJourOuvre(new Date());
    var cumul = 0, total = 0;
    var parCentre = {}, charge = {};
    var lignes = file.map(function (c) {
      var t = travailRestant(c);
      Object.keys(t.parCentre).forEach(function (k) { parCentre[k] = (parCentre[k] || 0) + t.parCentre[k]; });
      total += t.total;
      var jours = capJour ? Math.max(1, Math.ceil(t.total / capJour)) : 1;
      var fixe = dateDe(c.debutPlanifie);
      var debut, fin;
      if (fixe) {
        debut = prochainJourOuvre(fixe);
        fin = ajouterJoursOuvres(debut, jours - 1);
      } else {
        var debutJ = capJour ? cumul / capJour : 0;
        cumul += t.total;
        var finJ = capJour ? cumul / capJour : 0;
        debut = ajouterJoursOuvres(depart, Math.floor(debutJ));
        fin = ajouterJoursOuvres(depart, Math.max(Math.ceil(finJ) - 1, Math.floor(debutJ)));
      }
      var duree = joursOuvresEntre(debut, fin) + 1;
      for (var k = 0, d = new Date(debut.getTime()); k < 400 && d <= fin; k++, d = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1)) {
        if (d.getDay() === 0 || d.getDay() === 6) continue;
        charge[ymd(d)] = (charge[ymd(d)] || 0) + t.total / duree;
      }
      var ech = dateDe(c.echeance);
      var statut = "sansdate";
      if (ech) {
        var marge = joursOuvresEntre(fin, ech);
        statut = marge < 0 ? "retard" : marge < 2 ? "juste" : "ok";
      }
      return { cmd: c, reste: t.total, debut: debut, fin: fin, jours: duree, echeance: ech, statut: statut, fixe: !!fixe };
    });
    return { capJour: capJour, lignes: lignes, parCentre: parCentre, total: total, charge: charge, depart: depart };

  // ===================================================================

  var files = {};

  function texteErreur(e) {
    var code = e && e.code;
    if (code === "invalid_argument") return "Enregistrement refusé : vous n'avez pas les droits de modification.";
    if (code === "resource_exhausted") return "Trop de modifications d'un coup. Réessayez dans un instant.";
    if (code === "quota_exceeded") return "L'espace de stockage est plein.";
    if (code === "revoked" || code === "not_granted") return "L'accès aux données a été retiré.";
    return "L'enregistrement n'a pas abouti. Réessayez.";

    if (!magasin) return;
    if (!peutEcrire) { signaler("Lecture seule : vous ne pouvez pas modifier.", true); return; }
    var f = files[chemin] || (files[chemin] = { encours: false, patch: null, message: null });
    f.patch = f.patch ? fusion(f.patch, patch) : patch;
    if (message) f.message = message;
    if (!f.encours) vider(chemin, f);

  function vider(chemin, f) {

    charge: { sens: "plage", v: 80, v2: 100 },

    var v2 = Number(String(etat.parametres["objectif_" + cle + "_haut"] || "").replace(",", "."));

  function indicateurs(periode) {

    // --- Commercial

      h("p", { class: "aide", style: { marginBottom: "10px" } }, "Copiez ce fichier dans data/operations.csv du dépôt, puis lancez npm run seed : les affectations passent dans la base de l'application." + (ignorees ? " Les " + ignorees + " opérations « à confirmer » sortent avec la case vide : confirmez-les d'abord dans l'onglet Opérations." : "")),
      h("div", { class: "actions", style: { marginBottom: "10px" } }, bouton("Copier le CSV", function () {
        var repli = function () {
          try { var r = document.createRange(); r.selectNodeContents(pre); var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r); } catch (e) { /* rien */ }
          signaler("Copie refusée : le texte est sélectionné, copiez-le à la main.", true);
        };
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(texte).then(function () { signaler("CSV copié"); }, repli); else repli();
      }, { classe: "principal", ecriture: false })), pre));
  }

  // ===================================================================
  // Chronomètres
  // ===================================================================

  function rafraichirChronos() {
    var t = Date.now();
    document.querySelectorAll("[data-debut]").forEach(function (n) {
      var d = Date.parse(n.dataset.debut);
      if (isNaN(d)) return;
      var min = Math.max(0, Math.floor((t - d) / 60000));
      n.textContent = min < 1 ? "depuis moins d'une minute" : min < 60 ? "depuis " + min + " min" : "depuis " + Math.floor(min / 60) + " h " + String(min % 60).padStart(2, "0");
    });
  }
  window.setInterval(rafraichirChronos, 20000);

  // ===================================================================
  // Navigation et données
  // ===================================================================

  function lireRoute() {
    var x = (window.location.hash || "").slice(1);
    if (["commandes", "planning", "atelier", "reglages", "nouvelle", "tableau", "indicateurs", "assistant"].indexOf(x) !== -1) return { vue: x };
    if (x.indexOf("commande-") === 0) return { vue: "commande", id: x.slice(9) };
    return { vue: "tableau" };
  }

  var largeurVue = window.innerWidth, minuteurTaille = null;
  window.addEventListener("resize", function () {
    window.clearTimeout(minuteurTaille);
    minuteurTaille = window.setTimeout(function () {
      if (window.innerWidth !== largeurVue) { largeurVue = window.innerWidth; planifierRendu(); }
    }, 180);
  });

  document.getElementById("verrou").addEventListener("click", verrouiller);

  window.addEventListener("hashchange", function () { etat.route = lireRoute(); etat.confirmation = null; etat.fin = null; rendre(); });

  etat.route = lireRoute();
  rendre();

  var minuteur = window.setTimeout(function () { if (!etat.pret.ops || !etat.pret.cmd) { etat.lent = true; rendre(); } }, 10000);
  function recu() { if (etat.pret.ops && etat.pret.cmd) window.clearTimeout(minuteur); planifierRendu(); }
  function echec(e) { window.clearTimeout(minuteur); etat.erreur = texteErreur(e); rendre(); }

  // Une commande écrite avant la nomenclature (avec une simple « gamme ») est
  // lue comme un coffret dont les opérations portent sur le coffret monté.
  function normaliserCommande(id, d) {
    var c = Object.assign({
      numero: "", client: "", produit: "", quantite: 0, echeance: "", typologie: "standard", famille: "", essence: "Chêne",
      finition: "", marquage: "aucun", notes: "", etape: 1, historique: {}, prixUnitaireHT: "", coutMatiereEstime: "",
      prototypeRequis: true, controles: {}, clos: false, perdue: false
    }, d, { id: id, etape: Math.min(10, Math.max(1, Number(d.etape) || 1)) });
    c.coffret = Object.assign({ longueur: d.longueurMm || "", largeur: d.largeurMm || "", hauteur: d.hauteurMm || "", epaisseur: "12" }, d.coffret || {});
    var pieces = Array.isArray(d.pieces) ? d.pieces.slice() : [];
    if (!pieces.some(function (p) { return p.genre === "coffret"; })) {
      pieces.unshift(pieceCoffret(Array.isArray(d.pieces) ? [] : (d.gamme || []).map(function (op) { return { op: op, n: 1 }; })));
    }
    c.pieces = pieces.map(function (p) { return p.matiere ? Object.assign({}, p, { matiere: essenceCanon(p.matiere) }) : p; });
    c.essence = essenceCanon(c.essence) || "Chêne";
    return c;
  }

  if (!window.claude || typeof window.claude.use !== "function") {
    window.setTimeout(function () { window.clearTimeout(minuteur); etat.erreur = "Cette page a besoin du stockage de l'artefact, indisponible ici."; rendre(); }, 1500);
    return;
  }

  window.claude.use("sample").then(function (fn) { etat.sample = typeof fn === "function" ? fn : null; planifierRendu(); }).catch(function () { /* sans assistant */ });

  window.claude.use("user").then(function (u) {
    if (u && typeof u.isOwner === "function") u.isOwner().then(function (o) { etat.acces.proprietaire = !!o; planifierRendu(); }).catch(function () { /* inconnu */ });
    if (!u || typeof u.can !== "function") return;
    return u.can("data.write").then(function (droit) { if (droit === false) { peutEcrire = false; planifierRendu(); } });
  }).catch(function () { /* sans information, les champs restent actifs */ });

  window.claude.use("db").then(function (db) {
    if (!db) { window.clearTimeout(minuteur); etat.erreur = "Les données ne sont pas accessibles depuis cette vue. Essayez en étant connecté."; rendre(); return; }
    magasin = db;
    var signalerErreur = function (e) { signaler(texteErreur(e), true); };

    db.collection("operations").orderBy("ordre").onSnapshot(function (snap) {
      etat.operations = snap.docs.map(function (d) {
        var v = d.data() || {};
        return { id: d.id, nom: v.nom || d.id, ordre: typeof v.ordre === "number" ? v.ordre : 0, tempsUnitaireMin: v.tempsUnitaireMin, tempsReglageMin: v.tempsReglageMin,
          nbOperateurs: typeof v.nbOperateurs === "number" ? v.nbOperateurs : 1, centreTravail: v.centreTravail || null, categorie: v.categorie || null,
          categorieSource: v.categorieSource || (v.categorie ? "gerant" : null),
          centreSource: v.centreSource || (v.centreTravail ? "gerant" : null), actif: v.actif !== false };
      });
      etat.opParId = {};
      etat.operations.forEach(function (op) { etat.opParId[op.id] = op; });
      etat.pret.ops = true;
      recu();
    }, echec);

    db.collection("commandes").onSnapshot(function (snap) {
      etat.commandes = snap.docs.map(function (d) { return normaliserCommande(d.id, d.data() || {}); });
      etat.cmdParId = {};
      etat.commandes.forEach(function (c) {
        etat.cmdParId[c.id] = c;
        var loc = etat.piecesLocales[c.id];
        if (loc && JSON.stringify(loc) === JSON.stringify(c.pieces)) delete etat.piecesLocales[c.id];
      });
      etat.pret.cmd = true;
      purgerBrouillons();
      recu();
    }, echec);

    db.collection("pointages").onSnapshot(function (snap) {
      etat.pointages = snap.docs.map(function (d) { var v = d.data() || {}; v.id = d.id; return v; });
      if (etat.fin && !etat.pointages.some(function (pt) { return pt.id === etat.fin.pointageId && !pt.fin; })) etat.fin = null;
      recu();
    }, signalerErreur);

    var simple = function (col, cible) {
      db.collection(col).orderBy("nom").onSnapshot(function (snap) {
        etat[cible] = snap.docs.map(function (d) { var v = d.data() || {}; return Object.assign({}, v, { id: d.id, nom: v.nom || d.id }); });
        planifierRendu();
      }, signalerErreur);
    };
    simple("centres", "centres");
    simple("emplacements", "emplacements");
    simple("zones", "zones");

    db.collection("acces").onSnapshot(function (snap) {
      var doc = snap.docs.filter(function (d) { return d.id === "plateforme"; })[0];
      etat.acces.doc = doc ? doc.data() : null;
      etat.acces.charge = true;
      planifierRendu();
    }, function (e) { etat.acces.charge = true; signalerErreur(e); });

    db.collection("demandes").onSnapshot(function (snap) {
      etat.demandes = snap.docs.map(function (d) { var v = d.data() || {}; return Object.assign({}, v, { id: d.id }); });
      planifierRendu();
    }, signalerErreur);
    simple("operateurs", "operateurs");
    simple("typesCoupe", "typesCoupe");

    db.collection("parametres").onSnapshot(function (snap) {
      var p = {};
      snap.docs.forEach(function (d) { var v = d.data() || {}; p[d.id] = v.valeur === undefined || v.valeur === null ? "" : String(v.valeur); });
      etat.parametres = p;
      purgerBrouillons();
      planifierRendu();
    }, signalerErreur);
  }).catch(echec);
})();
</script>
